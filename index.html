function reportRange(mode,from,to){const now=new Date(),y=now.getFullYear(),m=now.getMonth();if(mode==='Mes actual')return [localISO(new Date(y,m,1)),localISO(new Date(y,m+1,0))];if(mode==='Mes anterior')return [localISO(new Date(y,m-1,1)),localISO(new Date(y,m,0))];if(mode==='Año actual')return [y+'-01-01',y+'-12-31'];if(mode==='Año anterior')return [(y-1)+'-01-01',(y-1)+'-12-31'];return [from||'0001-01-01',to||'9999-12-31']}

rong>'+x[1]+'</strong></div>').join('')+'</div><div class="card"><h3>Detalle de notas de entrega</h3><div class="tablewrap"><table><thead><tr><th>FECHA</th><th>ID</th><th>NOMBRES</th><th>PRODUCTO</th><th>CANTIDAD</th><th>PRECIO UNITARIO</th><th>SUBTOTAL</th><th>IVA 15%</th><th>TOTAL A FACTURAR</th><th>VALOR UNITARIO CON IVA</th></tr></thead><tbody>'+lines.map(x=>'<tr><td>'+x.date+'</td><td><b>'+x.number+'</b></td><td>'+esc(x.name)+'</td><td>'+esc(x.product)+'</td><td>'+x.qty+'</td><td>'+money(x.unit)+'</td><td>'+money(x.subtotal)+'</td><td>'+money(x.iva)+'</td><td><b>'+money(x.total)+'</b></td><td>'+money(x.unitWithVat)+'</td></tr>').join('')+'</tbody><tfoot><tr><th colspan="6">TOTALES</th><th>'+money(sum('subtotal'))+'</th><th>'+money(sum('iva'))+'</th><th>'+money(sum('total'))+'</th><th>—</th></tr></tfoot></table></div></div>';const sel=$('#report-period');sel.value=mode;const custom=mode==='Personalizado';$('#report-from-wrap').style.display=custom?'':'none';$('#report-to-wrap').style.display=custom?'':'none';sel.onchange=()=>{mode=sel.value;draw()};$('#report-from').onchange=e=>{from=e.target.value;draw()};$('#report-to').onchange=e=>{to=e.target.value;draw()};$('#report-export').onclick=async()=>{try{const X=await ensureXLSX(),rows=[['FECHA','ID','NOMBRES','PRODUCTO','CANTIDAD','PRECIO UNITARIO','SUBTOTAL','IVA 15%','TOTAL A FACTURAR','VALOR UNITARIO CON IVA'],...lines.map(x=>[{v:new Date(x.rawDate),t:'d',z:'dd/mm/yyyy'},x.number,x.name,x.product,x.qty,+x.unit.toFixed(4),+x.subtotal.toFixed(2),+x.iva.toFixed(2),+x.total.toFixed(2),+x.unitWithVat.toFixed(4)])],ws=X.utils.aoa_to_sheet(rows),wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Reporte');X.writeFile(wb,'reporte-notas-entrega.xlsx',{cellDates:true})}catch(e){msg('No se pudo generar el Excel: '+e.message)}}};draw()}async function users(p){let a=await get('profiles');p.innerHTML=head('Usuarios','Administra vendedores e invitaciones.',btn('+ Invitar vendedor','invite'))+'<div class="card"><table><the ound:'+(brand.dark_color||'#102b3f')+'"></span><small>Oscuro</small></div></div><small id="brandhint" style="display:block;color:var(--muted);margin-top:8px">Sube un logo para detectar los colores.</small><div id="brandchoices" style="margin-top:12px;display:grid;gap:10px"></div></div></div><button id="brandsave" class="btn primary">Guardar identidad</button></div><div class="card"><h3>Configuración general</h3><p>Moneda: USD · Zona horaria: America/Guayaquil</p><p>El catálogo y las reglas de lotes siguen bajo control del administrador.</p></div><div class="card"><h3>Permisos especiales · Eliminar notas</h3><p>Tu cuenta de administrador siempre puede eliminar. Activa el permiso únicamente a los vendedores que tú autorices.</p><div id="deliveryDeleteUsers" style="display:grid;gap:10px"><p>Cargando usuarios…</p></div></div>';

$('#brandfile').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>5*1024*1024)return msg('El logotipo supera el máximo de 5 MB.');if(!['image/png','image/jpeg','image/webp'].includes(f.type))return msg('Formato no compatible. Usa PNG, JPG o WEBP.');try{const raw=await new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=no;rd.readAsDataURL(f)});const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=raw});const scale=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const outType=f.type==='image/jpeg'?'image/jpeg':(f.type==='image/webp'?'image/webp':'image/png');logo=outType==='image/jpeg'?c.toDataURL(outType,.9):c.toDataURL(outType,.92);if(logo.length>900000)return msg('El archivo sigue siendo demasiado grande. Prueba con un logo más ligero.');palette=await detectLogoColors(logo);$('#brandpreview').innerHTML='<img src="'+logo+'" style="display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;margin:auto">';$('#brandp').style.background=palette.primary_color;$('#brandd').style.background=palette.dark_color;$('#brandhint').textContent='Elige qué colores detectados quieres usar.';$('#brandchoices').innerHTML=['primary','dark'].map(kind=>'<div><small style="display:block;margin-bottom:6px">'+(kind==='primary'?'Color principal':'Color oscuro')+'</small><div style="display:flex;gap:8px;flex-wrap:wrap">'+(palette.colors||[]).map(col=>'<button type="button" data-kind="'+kind+'" data-color="'+col+'" title="'+col+'" style="width:34px;height:30px;border-radius:7px;border:2px solid '+(palette[kind+'_color']===col?'var(--navy)':'var(--line)')+';background:'+col+';cursor:pointer"></button>').join('')+'</div></div>').join('');$('#brandchoices').querySelectorAll('button[data $('#add-company').onclick=()=>modal('Agregar empresa','Crea una empresa independiente. Puedes completar el RUC ahora o después.','<div class="formgrid"><div class="field wide"><label>Nombre comercial *</label><input name="company_name" required placeholder="Ej. Empresa nueva"></div><div class="field wide"><label>RUC (opcional)</label><input name="company_tax_id" inputmode="numeric" maxlength="13" placeholder="Se puede completar después"></div></div>',async()=>{const n=val('company_name').trim(),tax=val('company_tax_id').trim();if(!n)return msg('Escribe el nombre de la empresa.');if(tax&&tax.length!==13)return msg('El RUC debe tener 13 dígitos.');const z=await sb.rpc('create_company',{_name:n,_tax_id:tax||null});if(z.error)return msg(z.error.message);const pr=await sb.from('profiles').select('*').eq('user_id',user.id).single();if(pr.data)profile=pr.data;await loadCompanyContext();await loadBrand();close();msg('Empresa creada. Ahora estás trabajando en '+n+'.');shell()});
